name: Verificação técnica do AVIVA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Testes de módulos, AWS e dados
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            modulos/comunidade/requirements.txt
            modulos/reabilitacao/requirements.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r modulos/comunidade/requirements.txt -r modulos/reabilitacao/requirements.txt pytest
      - name: Testes Comunidade
        working-directory: modulos/comunidade
        run: python -m pytest -q tests
      - name: Testes Saúde e Reabilitação
        working-directory: modulos/reabilitacao
        run: python -m pytest -q tests
      - name: Testes da Lambda reconstruída
        run: python -m unittest discover -s infra/aws/tests -v
      - name: Integridade dos dados públicos e SQL
        run: python banco-de-dados/testes/testar_integridade_base.py
